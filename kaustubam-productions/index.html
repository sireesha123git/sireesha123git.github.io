<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="img/kp-logo.jpg">
<link rel="canonical" href="https://sireesha123git.github.io/kaustubam-productions/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Kaustubam Productions">
<meta property="og:title" content="KP-WOW World of Wonders · Kaustubam Productions">
<meta property="og:description" content="Short AI films about the festivals, companies and birds of our world, and ad films for brands. New films every week.">

<meta property="og:url" content="https://sireesha123git.github.io/kaustubam-productions/">

<title>KP-WOW World of Wonders</title>
<meta name="description" content="KP-WOW World of Wonders by Kaustubam Productions: short films about the festivals, companies and birds of our world.">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: a night-sky lobby (brand gold on navy, from the KP logo) with three arched doorways;
   each doorway opens into a light, sunlit world page with its own scene banner and two folders. */
:root{
  color-scheme: dark;
  --night:#0b1020; --night-2:#151b36; --night-3:#1f2748;
  --gold:#d9b46c; --gold-hi:#f4dca6; --gold-lo:#9c7a3c;
  --ruby:#c42c40;
  --moon:#ece6d8; --mist:#a9afc8;
  --ink:#1e1b2c; --ink-2:#5a5670;
  --paper:#fbf7f0; --line:rgba(30,27,44,.12);
  /* per-world tints (set again on each world page) */
  --w-bg:#fff6ea; --w-accent:#c4572b; --w-soft:#ffe6cf;
  --f-brand:"Cinzel","Trajan Pro",Georgia,serif;
  --f-display:"Cormorant Garamond","Cormorant",Georgia,"Times New Roman","Noto Sans Devanagari","Noto Sans Telugu","Noto Sans Tamil","Noto Sans Arabic","Hiragino Sans","Yu Gothic","Microsoft YaHei","PingFang SC",serif;
  --f-body:"Figtree","Noto Sans Devanagari","Noto Sans Telugu","Noto Sans Tamil","Noto Sans Arabic","Hiragino Sans","Yu Gothic","Microsoft YaHei","PingFang SC","Segoe UI",system-ui,-apple-system,sans-serif;
  --gutter-l:max(16px, env(safe-area-inset-left, 0px));
  --gutter-r:max(16px, env(safe-area-inset-right, 0px));
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--night);color:var(--moon);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--night)}
a{color:inherit}
img{max-width:100%;display:block}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-left:var(--gutter-l);padding-right:var(--gutter-r)}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px;border-radius:6px}
.eyebrow{font-size:.74rem;letter-spacing:.22em;text-transform:uppercase;font-weight:600}

/* ---------- top bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(11,16,32,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(217,180,108,.16)}
.bar .wrap{display:flex;align-items:center;gap:20px;padding-block:12px;flex-wrap:wrap}
.mark{display:flex;align-items:center;gap:10px;text-decoration:none}
.mark img{width:34px;height:34px;border-radius:50%;border:1px solid rgba(217,180,108,.5)}
.mark b{font-family:var(--f-brand);font-weight:700;letter-spacing:.08em;color:var(--gold-hi);font-size:1.05rem}
.nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.nav a{text-decoration:none;font-size:.88rem;font-weight:500;color:var(--mist);padding:7px 12px;border-radius:999px;transition:color .2s,background .2s}
.social{display:flex;gap:6px}
.social:empty{display:none}
.social a{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;border:1px solid rgba(217,180,108,.4);color:var(--gold-hi)}
.social a:hover{background:var(--gold-hi);color:var(--night)}
.social svg{width:16px;height:16px}
.nav a:hover,.nav a[aria-current="page"]{color:var(--night);background:var(--gold-hi)}

/* ---------- lobby hero ---------- */
.sky{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.hero{position:relative;overflow:hidden;background:radial-gradient(1200px 520px at 78% 30%, #23305e 0%, transparent 60%),radial-gradient(800px 400px at 10% 90%, #2a1f3f 0%, transparent 70%),var(--night)}
.hero .wrap{position:relative;display:grid;grid-template-columns:1.25fr .9fr;gap:40px;align-items:center;padding-block:72px 56px}
.hero h1{font-family:var(--f-brand);font-weight:700;font-size:clamp(3.2rem,9vw,7.4rem);line-height:.95;letter-spacing:.04em;background:linear-gradient(170deg,var(--gold-hi) 10%,var(--gold) 45%,var(--gold-lo) 90%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .sub{font-family:var(--f-display);font-style:italic;font-weight:500;font-size:clamp(1.6rem,3.6vw,2.5rem);color:var(--moon);margin-top:6px}
.hero .lede{max-width:34rem;color:var(--mist);font-size:1.08rem;margin-top:22px}
.hero .by{margin-top:26px;color:var(--gold);font-family:var(--f-brand);letter-spacing:.24em;font-size:.8rem}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:999px;font-weight:600;font-size:.95rem;text-decoration:none;transition:transform .2s,box-shadow .2s}
.btn.gold{background:linear-gradient(160deg,var(--gold-hi),var(--gold));color:var(--night);box-shadow:0 8px 30px -10px rgba(217,180,108,.7)}
.btn.ghost{border:1px solid rgba(217,180,108,.45);color:var(--gold-hi)}
.btn:hover{transform:translateY(-2px)}
.emblem{position:relative;justify-self:center;width:min(380px,80vw);aspect-ratio:1}
.emblem img{position:absolute;inset:12%;width:76%;height:76%;border-radius:50%;object-fit:cover;box-shadow:0 0 0 1px rgba(217,180,108,.35),0 30px 80px -20px rgba(0,0,0,.8)}
.orbit{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(217,180,108,.35);animation:spin 40s linear infinite}
.orbit::after{content:"";position:absolute;top:50%;left:-6px;width:12px;height:12px;border-radius:50%;background:var(--gold-hi);box-shadow:0 0 18px var(--gold)}
.orbit.two{inset:5%;border-style:dashed;border-color:rgba(217,180,108,.18);animation-duration:70s;animation-direction:reverse}
.orbit.two::after{background:var(--ruby);box-shadow:0 0 14px var(--ruby);width:9px;height:9px;left:auto;right:-4px;top:30%}
@keyframes spin{to{transform:rotate(360deg)}}

/* week rhythm */
.week{position:relative;border-top:1px solid rgba(217,180,108,.16);background:rgba(11,16,32,.6)}
.week .wrap{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center;padding-block:18px}
.week .lbl{font-family:var(--f-display);font-style:italic;font-size:1.25rem;color:var(--gold-hi)}
.days{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.day{border:1px solid rgba(169,175,200,.18);border-radius:12px;padding:8px 10px;min-width:0}
.day b{display:block;font-size:.72rem;letter-spacing:.18em;color:var(--mist)}
.day span{display:block;font-size:.86rem;font-weight:600;line-height:1.3}
.day.f span{color:#ffc58a}.day.c span{color:#9fd3e6}.day.b span{color:#b9dcb0}
.week .note{grid-column:1/-1;font-size:.8rem;color:var(--mist)}

/* ---------- doorways ---------- */
.lobby{padding-block:84px 40px}
.lobby .head{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin-bottom:36px}
.lobby h2,.sec-title{font-family:var(--f-display);font-weight:600;font-size:clamp(2.1rem,4.6vw,3.4rem);line-height:1.05;color:var(--moon)}
.lobby h2 em,.sec-title em{color:var(--gold-hi)}
.lobby .head p{color:var(--mist);max-width:28rem}
.doors{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px}
.door{position:relative;display:flex;flex-direction:column;text-decoration:none;color:var(--moon)}
.arch{position:relative;aspect-ratio:3/4;border-radius:999px 999px 22px 22px;overflow:hidden;border:1px solid rgba(217,180,108,.35);box-shadow:0 30px 60px -30px rgba(0,0,0,.9);transition:transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .45s,border-color .45s;isolation:isolate}
.arch svg{position:absolute;inset:0;width:100%;height:100%}
.arch::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 10px rgba(11,16,32,.35),inset 0 -120px 80px -40px rgba(11,16,32,.85)}
.door:hover .arch,.door:focus-visible .arch{transform:translateY(-8px);border-color:var(--gold-hi);box-shadow:0 40px 80px -30px rgba(0,0,0,.9),0 0 60px -10px var(--glow)}
.door .inarch{position:absolute;left:0;right:0;bottom:22px;z-index:2;text-align:center;padding-inline:18px}
.door .code{font-family:var(--f-brand);letter-spacing:.3em;font-size:.78rem;color:var(--gold-hi)}
.door h3{font-family:var(--f-display);font-weight:600;font-size:clamp(1.7rem,2.6vw,2.2rem);line-height:1.05;margin-top:4px}
.door .meta{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:16px}
.chip{font-size:.78rem;font-weight:600;padding:5px 11px;border-radius:999px;border:1px solid rgba(217,180,108,.35);color:var(--gold-hi);background:rgba(11,16,32,.4)}
.door .desc{margin-top:12px;color:var(--mist);font-size:.95rem;text-align:center;padding-inline:8px}
.door .enter{display:block;text-align:center;margin-top:10px;font-weight:600;font-size:.9rem;color:var(--gold-hi)}
.door[data-w="wof"]{--glow:rgba(255,166,77,.55)}
.door[data-w="woc"]{--glow:rgba(110,190,225,.5)}
.door[data-w="wob"]{--glow:rgba(240,150,130,.5)}
.door[data-w="woa"]{--glow:rgba(150,120,235,.55)}

/* ---------- latest row ---------- */
.latest{padding-block:40px 70px}
.row-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.row-head a{color:var(--gold-hi);font-weight:600;text-decoration:none}
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,1fr);gap:20px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x mandatory}
.strip > *{scroll-snap-align:start}

/* ---------- KP ---------- */
.kp{background:linear-gradient(180deg,var(--night) 0%,var(--night-2) 100%);padding-block:80px}
.kp .wrap{display:grid;grid-template-columns:.8fr 1.2fr;gap:56px;align-items:center}
.kp-frame{position:relative;width:min(340px,80vw);justify-self:center;aspect-ratio:3/4;border-radius:999px 999px 20px 20px;overflow:hidden;border:1px solid rgba(217,180,108,.45)}
.kp-frame img{width:100%;height:100%;object-fit:cover;object-position:50% 30%}
.kp p{color:var(--mist);max-width:34rem;margin-top:16px;font-size:1.05rem}
.gem{display:inline-block;width:12px;height:12px;background:var(--ruby);transform:rotate(45deg);border:1px solid #e9e4ee;margin-right:8px;vertical-align:1px;box-shadow:0 0 12px rgba(196,44,64,.8)}

/* ---------- partners ---------- */
.partners{padding-block:84px;background:var(--night-2);border-top:1px solid rgba(217,180,108,.14)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;margin-top:36px}
.fact{border-top:1px solid rgba(217,180,108,.4);padding-top:18px;min-width:0}
.fact .num{font-family:var(--f-display);font-size:2.6rem;line-height:1;color:var(--gold-hi);font-weight:600}
.fact h3{font-size:1.05rem;margin-top:10px;font-weight:600}
.fact p{color:var(--mist);margin-top:6px;font-size:.95rem}
.contact{margin-top:48px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;padding:26px 28px;border-radius:22px;background:linear-gradient(130deg,rgba(217,180,108,.16),rgba(196,44,64,.1));border:1px solid rgba(217,180,108,.3)}
.contact h3{font-family:var(--f-display);font-size:1.8rem;font-weight:600}
.contact p{color:var(--mist)}
.contact .acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.email{font-family:var(--f-body);font-weight:600;color:var(--gold-hi);user-select:all;word-break:break-all}
.copy{cursor:pointer;font:inherit;font-size:.85rem;font-weight:600;background:transparent;border:1px solid rgba(217,180,108,.45);color:var(--gold-hi);padding:8px 14px;border-radius:999px}
footer{padding-block:30px;color:var(--mist);font-size:.85rem;border-top:1px solid rgba(217,180,108,.14)}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* ---------- world pages (light) ---------- */
.world{background:var(--w-bg);color:var(--ink);min-height:70vh}
.world[data-w="wof"]{--w-bg:#fff7ee;--w-accent:#b8501f;--w-soft:#ffe4c8;--w-deep:#5c2414}
.world[data-w="woc"]{--w-bg:#f1f6f8;--w-accent:#1f6f8b;--w-soft:#d7eaf1;--w-deep:#123c4c}
.world[data-w="wob"]{--w-bg:#f3f6ef;--w-accent:#4f7a45;--w-soft:#dfead4;--w-deep:#25402a}
.world[data-w="woa"]{--w-bg:#f5f2fc;--w-accent:#5b3fa6;--w-soft:#e5ddf7;--w-deep:#2a1c58}
.banner{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.banner svg{position:absolute;inset:0;width:100%;height:100%}
.banner .wrap{position:relative;padding-block:64px 52px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr);gap:30px;align-items:end}
.banner .back{display:inline-flex;gap:6px;align-items:center;font-size:.85rem;font-weight:600;text-decoration:none;color:var(--w-deep);background:rgba(255,255,255,.7);padding:6px 12px;border-radius:999px;margin-bottom:18px}
.banner .eyebrow{color:var(--w-accent)}
.banner h1{font-family:var(--f-display);font-weight:600;font-size:clamp(2.6rem,6.4vw,4.8rem);line-height:1;color:var(--w-deep);margin-top:6px}
.banner p.lead{max-width:36rem;color:var(--ink-2);font-size:1.08rem;margin-top:14px}
.stats{display:flex;gap:12px;flex-wrap:wrap;justify-content:flex-end}
.stat{background:rgba(255,255,255,.8);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:16px;padding:12px 16px;min-width:130px}
.stat b{display:block;font-family:var(--f-display);font-size:2rem;line-height:1;color:var(--w-deep);font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--ink-2)}

/* folders */
.folders{padding-block:40px 80px}
.tabs{display:flex;gap:6px;align-items:end;border-bottom:2px solid var(--w-accent);flex-wrap:wrap}
.tab{position:relative;cursor:pointer;font:inherit;font-weight:600;font-size:1rem;color:var(--ink-2);background:var(--w-soft);border:0;padding:12px 22px 10px 18px;border-radius:12px 18px 0 0;display:flex;gap:10px;align-items:center;text-decoration:none;transition:background .2s,color .2s}
.tab svg{width:20px;height:20px;flex:none}
.tab .n{font-size:.75rem;background:rgba(0,0,0,.08);border-radius:999px;padding:1px 8px;font-variant-numeric:tabular-nums}
.tab[aria-selected="true"]{background:var(--w-accent);color:#fff}
.tab[aria-selected="true"] .n{background:rgba(255,255,255,.25)}
.tab:hover{color:var(--w-deep)}
.tab[aria-selected="true"]:hover{color:#fff}
.panel{padding-top:28px}
.panel .hint{color:var(--ink-2);margin-bottom:22px;max-width:44rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:24px}
.grid.tall{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}

/* cards (shared by lobby strip and world pages) */
.card{position:relative;display:flex;flex-direction:column;text-decoration:none;color:inherit;border-radius:18px;overflow:hidden;background:#fff;border:1px solid var(--line);transition:transform .3s,box-shadow .3s;min-width:0}
.lobby-card{background:var(--night-3);border-color:rgba(217,180,108,.2);color:var(--moon)}
a.card:hover{transform:translateY(-4px);box-shadow:0 20px 40px -24px rgba(20,16,40,.55)}
.thumb{position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--w-soft)}
.thumb img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
a.card:hover .thumb img{transform:scale(1.05)}
.tall .thumb{aspect-ratio:9/16}
.tall .thumb img{object-position:62% 50%}
.play{position:absolute;inset:auto 14px 14px auto;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.play::before{content:"";margin-left:4px;border-left:14px solid var(--ruby);border-top:9px solid transparent;border-bottom:9px solid transparent}
.badge{position:absolute;top:12px;left:12px;font-size:.72rem;font-weight:700;letter-spacing:.06em;padding:4px 10px;border-radius:999px;background:rgba(11,16,32,.75);color:#fff}
.badge.soon{background:var(--ruby)}
.body{padding:14px 16px 18px;display:flex;flex-direction:column;gap:4px}
.body .eyebrow{font-size:.68rem;color:var(--w-accent)}
.lobby-card .body .eyebrow{color:var(--gold)}
.body h3{font-size:1.02rem;font-weight:600;line-height:1.35}
.body small{color:var(--ink-2);font-size:.82rem}
.lobby-card .body small{color:var(--mist)}
.card.soon .thumb img{filter:saturate(.6) brightness(.85)}
.card.soon{cursor:default}
.placeholder .thumb{display:grid;place-items:center}
.placeholder .thumb svg{position:absolute;inset:0;width:100%;height:100%}
.placeholder .thumb .lbl{position:relative;font-family:var(--f-display);font-size:1.6rem;font-weight:600;color:var(--w-deep);background:rgba(255,255,255,.8);padding:6px 16px;border-radius:12px;text-align:center}
.empty{padding:30px;border:1.5px dashed var(--line);border-radius:18px;color:var(--ink-2);background:rgba(255,255,255,.6)}

/* other worlds footer nav on world page */
.elsewhere{border-top:1px solid var(--line);padding-block:30px}
.elsewhere .wrap{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.elsewhere span{color:var(--ink-2);margin-right:6px}
.elsewhere a{font-weight:600;text-decoration:none;color:var(--w-deep);background:var(--w-soft);padding:8px 14px;border-radius:999px}

/* scene animation */
.rise{animation:rise var(--d,14s) linear infinite;animation-delay:var(--dl,0s)}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(var(--h,-700px))}}
.sway{animation:sway 4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes sway{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
.tw{animation:tw var(--d,3s) ease-in-out infinite alternate;animation-delay:var(--dl,0s)}
@keyframes tw{from{opacity:.25}to{opacity:1}}
.drift{animation:drift var(--d,40s) linear infinite;animation-delay:var(--dl,0s)}
@keyframes drift{from{transform:translateX(-260px)}to{transform:translateX(var(--w,1500px))}}
.flap{animation:flap .9s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center;animation-delay:var(--dl,0s)}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(-.5)}}
.flow{stroke-dasharray:4 7;animation:flow 6s linear infinite}
.sweep{animation:sweep var(--d,8s) ease-in-out infinite alternate;animation-delay:var(--dl,0s)}
@keyframes sweep{from{transform:rotate(calc(var(--a,0deg) - 12deg))}to{transform:rotate(calc(var(--a,0deg) + 12deg))}}
.roll{animation:roll 4s linear infinite}
@keyframes roll{to{transform:translateX(-60px)}}
@keyframes flow{to{stroke-dashoffset:-110}}

/* feedback form */
.talk{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:40px;margin-top:48px;padding:30px;border-radius:24px;background:linear-gradient(130deg,rgba(217,180,108,.14),rgba(196,44,64,.08));border:1px solid rgba(217,180,108,.3)}
.talk h3{font-family:var(--f-display);font-size:2rem;font-weight:600;line-height:1.1}
.talk .who{color:var(--mist);margin-top:10px}
.talk .reach{margin-top:22px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
form.fb{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label{font-size:.82rem;font-weight:600;color:var(--gold-hi);letter-spacing:.02em}
.fld label i{font-style:normal;color:var(--mist);font-weight:500}
.fld input,.fld select,.fld textarea{font:inherit;font-size:.95rem;color:var(--moon);background:rgba(11,16,32,.55);border:1px solid rgba(169,175,200,.3);border-radius:12px;padding:11px 13px;width:100%}
.fld textarea{min-height:120px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--gold-hi);box-shadow:0 0 0 3px rgba(217,180,108,.2)}
.fld input[aria-invalid="true"],.fld textarea[aria-invalid="true"]{border-color:#ff7a86}
.err{font-size:.8rem;color:#ff9aa4;min-height:1em}
[hidden]{display:none!important}
.hp{position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
.send{grid-column:1/-1;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.send button{cursor:pointer;border:0;font:inherit}
.status{font-size:.9rem;color:var(--mist)}
.status.ok{color:#b9e3b0}.status.bad{color:#ff9aa4}

/* language menu */
.lang{position:relative;display:flex;align-items:center;gap:6px}
.lang svg{width:16px;height:16px;color:var(--gold-hi);flex:none}
.lang select{font:inherit;font-size:.85rem;font-weight:600;color:var(--moon);background:rgba(11,16,32,.6);border:1px solid rgba(217,180,108,.4);border-radius:999px;padding:6px 28px 6px 12px;appearance:none;-webkit-appearance:none;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,var(--gold-hi) 50%),linear-gradient(135deg,var(--gold-hi) 50%,transparent 50%);background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.lang select:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
[dir="rtl"] .nav{margin-left:0;margin-right:auto}
[dir="rtl"] .lang select{padding:6px 12px 6px 28px;background-position:15px 55%,10px 55%}
footer .paybtn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:600;color:var(--night);background:linear-gradient(160deg,var(--gold-hi),var(--gold));padding:9px 16px;border-radius:999px}
footer .wrap{align-items:center}

/* pay & support page */
.payhero{position:relative;overflow:hidden;background:radial-gradient(900px 420px at 80% 20%,#2a2a5e 0%,transparent 60%),var(--night)}
.payhero .wrap{position:relative;padding-block:64px 40px}
.payhero h1{font-family:var(--f-display);font-weight:600;font-size:clamp(2.6rem,6vw,4.4rem);line-height:1;color:var(--gold-hi)}
.payhero p{color:var(--mist);max-width:40rem;margin-top:14px;font-size:1.08rem}
.paybody{padding-block:20px 90px}
.step{margin-top:34px}
.step h2{font-family:var(--f-display);font-weight:600;font-size:1.7rem;color:var(--moon);display:flex;gap:12px;align-items:baseline}
.step h2 .no{font-family:var(--f-brand);font-size:.9rem;color:var(--night);background:var(--gold-hi);border-radius:999px;width:28px;height:28px;display:inline-grid;place-items:center;flex:none}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}
.choice{position:relative;display:block;cursor:pointer;border:1px solid rgba(217,180,108,.3);border-radius:18px;padding:18px 20px 18px 52px;background:var(--night-2);transition:border-color .2s,background .2s}
.choice input{position:absolute;left:20px;top:22px;width:18px;height:18px;accent-color:var(--gold)}
.choice b{display:block;font-size:1.05rem;color:var(--moon)}
.choice span{display:block;color:var(--mist);font-size:.92rem;margin-top:4px}
.choice:has(input:checked){border-color:var(--gold-hi);background:linear-gradient(130deg,rgba(217,180,108,.16),rgba(196,44,64,.08))}
.choice:has(input:focus-visible){outline:2px solid var(--gold-hi);outline-offset:3px}
[dir="rtl"] .choice{padding:18px 52px 18px 20px}[dir="rtl"] .choice input{left:auto;right:20px}
.row3{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.2fr);gap:16px;margin-top:16px}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.quick button{cursor:pointer;font:inherit;font-size:.85rem;font-weight:600;color:var(--gold-hi);background:transparent;border:1px solid rgba(217,180,108,.4);border-radius:999px;padding:6px 12px}
.quick button:hover{background:rgba(217,180,108,.15)}
.result{margin-top:16px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.method{border:1px solid rgba(217,180,108,.3);border-radius:20px;padding:22px;background:var(--night-2);min-width:0}
.method h3{font-family:var(--f-display);font-size:1.5rem;font-weight:600;color:var(--gold-hi)}
.method p{color:var(--mist);margin-top:8px;font-size:.95rem}
.qr{width:200px;height:200px;margin-top:14px;padding:10px;background:#fff;border-radius:14px;display:grid;place-items:center}
.qr img,.qr canvas{width:180px!important;height:180px!important}
.kv{display:grid;grid-template-columns:auto 1fr auto;gap:8px 12px;align-items:center;margin-top:14px;font-size:.95rem}
.kv dt{color:var(--mist)}
.kv dd{margin:0;font-weight:600;color:var(--moon);word-break:break-all;font-variant-numeric:tabular-nums}
.kv button{cursor:pointer;font:inherit;font-size:.78rem;font-weight:600;color:var(--gold-hi);background:transparent;border:1px solid rgba(217,180,108,.4);border-radius:999px;padding:3px 10px}
.paynote{margin-top:20px;padding:16px 18px;border-radius:14px;border:1px dashed rgba(217,180,108,.4);color:var(--mist);font-size:.92rem}
.paynote strong{color:var(--gold-hi)}
@media (max-width:760px){ .choices,.row3,.result{grid-template-columns:1fr} }

@media (max-width:1100px){ .doors{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:900px){
  .talk{grid-template-columns:1fr}
  form.fb{grid-template-columns:1fr}
  .hero .wrap,.kp .wrap,.banner .wrap{grid-template-columns:1fr}
  .emblem{width:min(260px,70vw);order:-1}
  .doors{grid-template-columns:1fr;max-width:420px;margin-inline:auto}
  .arch{aspect-ratio:4/4.3}
  .facts{grid-template-columns:1fr}
  .stats{justify-content:flex-start}
  .week .wrap{grid-template-columns:1fr}
  .days{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:480px){
  .grid.tall{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .tab{padding:10px 14px 8px 12px;font-size:.92rem}
  .nav a{padding:6px 9px;font-size:.82rem}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
}

<script>
(function(){
/* ---------- language ---------- */
const LANGS=[["en","English"],["hi","हिन्दी"],["te","తెలుగు"],["ta","தமிழ்"],["es","Español"],["pt","Português"],["fr","Français"],["de","Deutsch"],["ar","العربية"],["ja","日本語"],["zh","中文"]];
const LOCALE={en:"en-GB",hi:"hi-IN",te:"te-IN",ta:"ta-IN",es:"es-ES",pt:"pt-BR",fr:"fr-FR",de:"de-DE",ar:"ar",ja:"ja-JP",zh:"zh-CN"};
const DICT=Object.assign({en:I18N_EN},window.I18N||{});
let LANG="en";
try{const saved=localStorage.getItem("kpwow-lang"); if(saved&&DICT[saved]) LANG=saved;}catch(e){}
function t(k,vars){let s=(DICT[LANG]&&DICT[LANG][k])||I18N_EN[k]||k; if(vars) for(const v in vars) s=s.split("{"+v+"}").join(vars[v]); return s;}
let fmt,fmtSoon;
function setFormats(){const loc=LOCALE[LANG]||"en-GB";
  fmt=new Intl.DateTimeFormat(loc,{day:"numeric",month:"short",year:"numeric",timeZone:"Asia/Kolkata"});
  fmtSoon=new Intl.DateTimeFormat(loc,{weekday:"short",day:"numeric",month:"short",timeZone:"Asia/Kolkata"});}
function applyStatic(){
  document.documentElement.lang=LANG; document.documentElement.dir=(LANG==="ar")?"rtl":"ltr";
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent=t(el.dataset.t));
  const sel=document.getElementById("lang-pick"); sel.setAttribute("aria-label",t("lang_label"));
}
const pick=document.getElementById("lang-pick");
pick.innerHTML=LANGS.map(([c,n])=>`<option value="${c}" lang="${c}">${n}</option>`).join("");
pick.value=LANG;
pick.addEventListener("change",()=>{LANG=pick.value;try{localStorage.setItem("kpwow-lang",LANG)}catch(e){}setFormats();applyStatic();lastView="";route();});

/* ---------- worlds ---------- */
const WORLDS={
  wof:{code:"WOF",films:"Festive Bytes",day:"one_mon"},
  woc:{code:"WOC",films:"Campus Chat",day:"one_wed"},
  wob:{code:"WOB",films:"Bird Bonds",day:"one_fri"},
  woa:{code:"WOA",films:"Memorable Ads",day:null}
};
const ORDER=["wof","woc","wob","woa"];
const TAB_IDS=["teasers","films"];
const tabsOf=w=>w==="woa"?[WORLDS[w].films]:[t("teasers"),WORLDS[w].films];
const app=document.getElementById("app");
const INBOX="kaustubamproductions@gmail.com";
const now=Date.now();

/* ---------- seeded random so scenes look the same on every visit ---------- */
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}

/* ---------- scene painter: festivals / companies / birds, dark (doorway) or light (banner) ---------- */
function scene(kind, light, W, H, seed){
  const r=rng(seed||7); let s="", defs="";
  const id=kind+(light?"L":"D")+seed;
  if(kind==="wof"){
    defs+=`<linearGradient id="g${id}" x1="0" y1="0" x2="0" y2="1">${light
      ?'<stop offset="0" stop-color="#fff8ef"/><stop offset=".7" stop-color="#ffe9d2"/><stop offset="1" stop-color="#ffd9b3"/>'
      :'<stop offset="0" stop-color="#1c0f2e"/><stop offset=".55" stop-color="#5a1f35"/><stop offset="1" stop-color="#c8622b"/>'}</linearGradient>
      <radialGradient id="l${id}"><stop offset="0" stop-color="${light?'#ffb35c':'#ffd27a'}" stop-opacity=".9"/><stop offset="1" stop-color="${light?'#ffb35c':'#ff9a3c'}" stop-opacity="0"/></radialGradient>`;
    s+=`<rect width="${W}" height="${H}" fill="url(#g${id})"/>`;
    // string lights (two swags)
    for(let k=0;k<2;k++){
      const y0=H*(.08+k*.09), sag=H*.07;
      s+=`<path d="M -10 ${y0} Q ${W/2} ${y0+sag*2} ${W+10} ${y0}" fill="none" stroke="${light?'#c9a57a':'#3a2433'}" stroke-width="1.2"/>`;
      const n=Math.round(W/34);
      for(let i=1;i<n;i++){const t=i/n,x=-10+(W+20)*t,y=(1-t)*(1-t)*y0+2*(1-t)*t*(y0+sag*2)+t*t*y0;
        const c=light?["#ff9f5a","#f2c14e","#e86a7a","#7cc4b2"][i%4]:["#ffd27a","#ff9a3c","#ffe9b0","#ff7a59"][i%4];
        s+=`<circle class="tw" style="--d:${(1.5+r()*2).toFixed(2)}s;--dl:${(-r()*3).toFixed(2)}s" cx="${x.toFixed(1)}" cy="${(y+5).toFixed(1)}" r="${light?3.4:3}" fill="${c}"/>`;}
    }
    // rising lanterns
    const L=Math.round(W/(light?70:45));
    for(let i=0;i<L;i++){
      const x=r()*W, sz=(light?14:12)+r()*14, d=(14+r()*16).toFixed(1), dl=(-r()*30).toFixed(1);
      const col=light?["#ff9b54","#f3b743","#ef7d6d","#f7a66b"][i%4]:["#ffb347","#ff8c42","#ffcf70"][i%3];
      s+=`<g transform="translate(${x.toFixed(1)} ${H+40})"><g class="rise" style="--d:${d}s;--dl:${dl}s;--h:-${H+120}px"><g class="sway">
        <circle r="${sz*1.6}" fill="url(#l${id})" opacity="${light?.45:.8}"/>
        <path d="M ${-sz*.45} ${-sz*.6} Q 0 ${-sz*.9} ${sz*.45} ${-sz*.6} L ${sz*.38} ${sz*.55} Q 0 ${sz*.72} ${-sz*.38} ${sz*.55} Z" fill="${col}" opacity="${light?.8:.95}"/>
        <rect x="${-sz*.2}" y="${sz*.55}" width="${sz*.4}" height="${sz*.12}" fill="${light?'#b36a2d':'#ffe0a0'}" opacity=".8"/></g></g></g>`;
    }
    // diyas along the bottom
    const D=Math.round(W/60);
    for(let i=0;i<D;i++){const x=(i+.5)*W/D+(r()-.5)*14,y=H-14-r()*10;
      s+=`<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"><path d="M -10 0 Q 0 10 10 0 Z" fill="${light?'#c9733a':'#7a3315'}"/><ellipse class="tw" style="--d:${(0.6+r()).toFixed(2)}s" cx="0" cy="-5" rx="2.6" ry="6" fill="${light?'#ffb347':'#ffd27a'}"/></g>`;}
  }
  if(kind==="woc"){
    defs+=`<linearGradient id="g${id}" x1="0" y1="0" x2="0" y2="1">${light
      ?'<stop offset="0" stop-color="#f6fbfd"/><stop offset="1" stop-color="#dcecf3"/>'
      :'<stop offset="0" stop-color="#08131f"/><stop offset=".7" stop-color="#0f2b40"/><stop offset="1" stop-color="#1b4a63"/>'}</linearGradient>`;
    s+=`<rect width="${W}" height="${H}" fill="url(#g${id})"/>`;
    const gridC=light?"rgba(31,111,139,.08)":"rgba(120,190,220,.07)";
    for(let x=0;x<W;x+=28) s+=`<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="${gridC}"/>`;
    for(let y=0;y<H;y+=28) s+=`<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="${gridC}"/>`;
    const base=H-12, fill=light?"#ffffff":"#0d2234", stroke=light?"#7fb0c4":"#3f84a8", win=light?"#f0b84a":"#ffd98a";
    let x=-10; const tops=[];
    while(x<W){
      const t=Math.floor(r()*4), w=34+r()*44, h=(light?.32:.36)*H+r()*H*(light?.38:.42);
      if(t===0){ // tower with spire
        s+=`<rect x="${x}" y="${base-h}" width="${w}" height="${h}" fill="${fill}" stroke="${stroke}"/><line x1="${x+w/2}" y1="${base-h}" x2="${x+w/2}" y2="${base-h-22}" stroke="${stroke}"/><circle class="tw" cx="${x+w/2}" cy="${base-h-24}" r="2.5" fill="#e0465a"/>`;
      } else if(t===1){ // campus with dome
        const hh=h*.45; s+=`<rect x="${x}" y="${base-hh}" width="${w*1.4}" height="${hh}" fill="${fill}" stroke="${stroke}"/><path d="M ${x+w*.3} ${base-hh} A ${w*.4} ${w*.4} 0 0 1 ${x+w*1.1} ${base-hh}" fill="${fill}" stroke="${stroke}"/>`; tops.push([x+w*.7,base-hh-w*.4]); x+=w*.4;
      } else if(t===2){ // factory sawtooth + chimney
        const hh=h*.4; let p=`M ${x} ${base} L ${x} ${base-hh}`; const teeth=3;
        for(let k=0;k<teeth;k++){const a=x+k*w*1.2/teeth,b=a+w*1.2/teeth;p+=` L ${b} ${base-hh-14} L ${b} ${base-hh}`;}
        p+=` L ${x+w*1.2} ${base} Z`; s+=`<path d="${p}" fill="${fill}" stroke="${stroke}"/><rect x="${x+w*1.2-10}" y="${base-hh-40}" width="7" height="40" fill="${fill}" stroke="${stroke}"/>`; x+=w*.2;
      } else { // glass slab with diagonal
        s+=`<rect x="${x}" y="${base-h}" width="${w}" height="${h}" fill="${fill}" stroke="${stroke}"/><line x1="${x}" y1="${base-h*.3}" x2="${x+w}" y2="${base-h}" stroke="${stroke}" opacity=".6"/>`;
      }
      if(t!==1) tops.push([x+w/2, base-h]);
      if(t===0||t===3){ for(let wy=base-h+10; wy<base-8; wy+=14) for(let wx=x+6; wx<x+w-8; wx+=11){ if(r()<.38) s+=`<rect class="tw" style="--d:${(2+r()*4).toFixed(1)}s;--dl:${(-r()*5).toFixed(1)}s" x="${wx.toFixed(1)}" y="${wy.toFixed(1)}" width="5" height="7" fill="${win}" opacity=".9"/>`; } }
      x+=w+6+r()*10;
    }
    // data links between rooftops
    for(let i=0;i+2<tops.length;i+=2){const a=tops[i],b=tops[i+2];
      s+=`<path class="flow" d="M ${a[0].toFixed(1)} ${a[1].toFixed(1)} Q ${((a[0]+b[0])/2).toFixed(1)} ${(Math.min(a[1],b[1])-50).toFixed(1)} ${b[0].toFixed(1)} ${b[1].toFixed(1)}" fill="none" stroke="${light?'#2e8fb0':'#79cdec'}" stroke-width="1.2" opacity="${light?.45:.6}"/>`;}
    s+=`<rect x="0" y="${base}" width="${W}" height="${H-base}" fill="${light?'#cfe3ec':'#0a1a28'}"/>`;
  }
  if(kind==="wob"){
    defs+=`<linearGradient id="g${id}" x1="0" y1="0" x2="0" y2="1">${light
      ?'<stop offset="0" stop-color="#eaf4f6"/><stop offset=".65" stop-color="#f8f1e6"/><stop offset="1" stop-color="#fbe5d2"/>'
      :'<stop offset="0" stop-color="#121a3c"/><stop offset=".45" stop-color="#4f3a72"/><stop offset=".78" stop-color="#d9796a"/><stop offset="1" stop-color="#f4bd73"/>'}</linearGradient>`;
    s+=`<rect width="${W}" height="${H}" fill="url(#g${id})"/>`;
    s+=`<circle cx="${W*.72}" cy="${H*.7}" r="${Math.min(W,H)*.16}" fill="${light?'#ffd9b0':'#ffd59a'}" opacity="${light?.7:.9}"/>`;
    const hills=light?["#cfe0c6","#b5cfa8","#9dbf8f"]:["#3a2d55","#2a2244","#1a1733"];
    hills.forEach((c,k)=>{const y=H*(.74+k*.08);let p=`M 0 ${H} L 0 ${y}`;for(let x=0;x<=W;x+=W/6)p+=` Q ${x+W/12} ${y-18-r()*26} ${x+W/6} ${y+(r()-.5)*10}`;p+=` L ${W} ${H} Z`;s+=`<path d="${p}" fill="${c}"/>`;});
    // tree on the right with a perched bird
    const tx=W*.88, ty=H*.8;
    s+=`<path d="M ${tx} ${H} L ${tx} ${ty-40} M ${tx} ${ty-20} L ${tx-36} ${ty-56} M ${tx} ${ty-34} L ${tx+30} ${ty-62}" stroke="${light?'#6c7d5c':'#15112a'}" stroke-width="4" stroke-linecap="round" fill="none"/>`;
    s+=`<g transform="translate(${tx-36} ${ty-56})"><path d="M -8 0 Q -4 -10 4 -9 L 9 -12 L 7 -7 Q 10 -1 2 2 L -2 6 L -3 2 Q -9 3 -14 7 Q -11 1 -8 0 Z" fill="${light?'#55704e':'#15112a'}"/></g>`;
    // flocks
    const F=light?3:4;
    for(let f=0;f<F;f++){
      const y0=H*(.12+r()*.4), n=4+Math.floor(r()*5), sc=.7+r()*.8, d=(28+r()*30).toFixed(1), dl=(-r()*50).toFixed(1);
      let g="";
      for(let i=0;i<n;i++){const bx=i*16*sc - Math.abs(i-n/2)*4, by=Math.abs(i-(n-1)/2)*9*sc + r()*4;
        g+=`<path class="flap" style="--dl:${(-r()).toFixed(2)}s" d="M ${bx} ${by} q ${5*sc} ${-6*sc} ${10*sc} 0 q ${5*sc} ${-6*sc} ${10*sc} 0" stroke="${light?'#44525e':'#1a1430'}" stroke-width="${1.6*sc}" fill="none" stroke-linecap="round"/>`;}
      s+=`<g transform="translate(0 ${y0.toFixed(1)})"><g class="drift" style="--d:${d}s;--dl:${dl}s;--w:${W+260}px">${g}</g></g>`;
    }
  }
  if(kind==="woa"){
    defs+=`<linearGradient id="g${id}" x1="0" y1="0" x2="0" y2="1">${light
      ?'<stop offset="0" stop-color="#f8f6fe"/><stop offset="1" stop-color="#e6def8"/>'
      :'<stop offset="0" stop-color="#0d0b24"/><stop offset=".6" stop-color="#261a58"/><stop offset="1" stop-color="#3e2877"/>'}</linearGradient>
      <linearGradient id="b${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${light?'#ffffff':'#fff2c8'}" stop-opacity="${light?.9:.55}"/><stop offset="1" stop-color="${light?'#ffffff':'#fff2c8'}" stop-opacity="0"/></linearGradient>`;
    s+=`<rect width="${W}" height="${H}" fill="url(#g${id})"/>`;
    // spotlight beams sweeping from the top
    [[.2,-14,7],[.5,0,9],[.8,14,8]].forEach(([fx,a,d],i)=>{const x=W*fx;
      s+=`<g transform="translate(${x.toFixed(1)} -10)"><g class="sweep" style="--d:${d}s;--a:${a}deg;--dl:${-i*2}s"><path d="M -6 0 L 6 0 L ${W*.16} ${H*.9} L ${-W*.16} ${H*.9} Z" fill="url(#b${id})"/></g></g>`;});
    // curtains at both edges
    const cc=light?"#d6cbf1":"#4a2c92", cd=light?"#c2b2ea":"#2c1a66", cw=Math.max(40,W*.09);
    for(const side of [0,1]){let g="";for(let k=0;k<4;k++){const x=k*cw/4;g+=`<rect x="${x}" y="0" width="${cw/4}" height="${H}" fill="${k%2?cd:cc}"/>`;}
      s+=`<g transform="${side?`translate(${W} 0) scale(-1 1)`:""}">${g}<path d="M 0 0 L ${cw*1.6} 0 Q ${cw} ${H*.08} ${cw} ${H*.22} L 0 ${H*.2} Z" fill="${cc}"/></g>`;}
    // sparkles
    for(let i=0;i<Math.round(W/22);i++){s+=`<circle class="tw" style="--d:${(1.5+r()*3).toFixed(1)}s;--dl:${(-r()*3).toFixed(1)}s" cx="${(cw+r()*(W-2*cw)).toFixed(1)}" cy="${(r()*H*.7).toFixed(1)}" r="${(r()*1.6+.6).toFixed(1)}" fill="${light?'#9a86d8':'#ffe3a6'}"/>`;}
    // film strip rolling along the bottom
    const fy=H-46, fh=34; let frames="";
    for(let x=-80;x<W+160;x+=60){frames+=`<rect x="${x+6}" y="${fy+8}" width="48" height="${fh-16}" rx="3" fill="${light?'#f1edfc':'#1e1744'}"/>`;
      for(const hy of [fy+2,fy+fh-6]) frames+=`<rect x="${x+4}" y="${hy}" width="6" height="4" rx="1" fill="${light?'#f1edfc':'#b4a6e8'}"/><rect x="${x+34}" y="${hy}" width="6" height="4" rx="1" fill="${light?'#f1edfc':'#b4a6e8'}"/>`;}
    s+=`<rect x="0" y="${fy}" width="${W}" height="${fh}" fill="${light?'#6d55b8':'#0a0818'}"/><g class="roll">${frames}</g>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs>${defs}</defs>${s}</svg>`;
}

function starfield(){
  const r=rng(42); let s="";
  for(let i=0;i<140;i++){const x=r()*1600,y=r()*700,rad=r()<.1?1.6:.8;
    s+=`<circle class="tw" style="--d:${(2+r()*4).toFixed(1)}s;--dl:${(-r()*4).toFixed(1)}s" cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${rad}" fill="${r()<.2?'#f4dca6':'#e8e6f4'}"/>`;}
  return `<svg viewBox="0 0 1600 700" preserveAspectRatio="xMidYMid slice" style="width:100%;height:100%" aria-hidden="true">${s}</svg>`;
}

function world(w,tab){

  const nextF=finals.filter(v=>!isLive(v)).sort((a,b)=>Date.parse(a.at)-Date.parse(b.at))[0];
  const one=tabs.length===1,keys=one?["films"]:TAB_IDS;
  const ti=keys.indexOf(tab);const sel=one?0:(ti<0?1:ti);
  const lists=one?[finals]:[teasers,finals];
  const isTeaser=!one&&sel===0;
  const items=lists[sel];
  let gridHTML;
  if(items.length) gridHTML=items.map(v=>card(v,{tall:isTeaser})).join("");
  else if(d.upcoming&&d.upcoming.length) gridHTML=d.upcoming.map((u,i)=>placeholder(w,u,i,isTeaser)).join("");

  const hints=one?[t(w+"_h0")]:[t(w+"_h0"),t(w+"_h1")];
  return `<div class="world" data-w="${w}">
    <section class="banner">${scene(w,true,1400,380,23)}

    const B=P.bank||{};
    const bank=(P.showBankDetails&&B.accountNumber)
      ?`<div class="method"><h3>${t("pay_bank")}</h3><dl class="kv">${kvRow(t("pay_acc_name"),B.accountName||"")}${kvRow(t("pay_acc_no"),B.accountNumber)}${kvRow(t("pay_ifsc"),B.ifsc||"")}${kvRow(t("pay_bank_name"),B.bankName||"")}${B.branch?kvRow(t("pay_branch"),B.branch):""}</dl></div>`
      :`<div class="method"><h3>${t("pay_bank")}</h3><p>${t("pay_bank_ask")}</p><p class="email" style="margin-top:10px">${INBOX}</p>
        <a class="btn ghost" style="margin-top:14px" href="${esc(mailto("Bank details request"))}" target="_blank" rel="noopener">${t("pay_bank_req")}</a></div>`;
    res.innerHTML=(upi||`<div class="method"><h3>${t("pay_upi")}</h3><p>${t("pay_soon",{mail:INBOX})}</p></div>`)+bank;
  } else {
    title.textContent=t("pay_intl_title");
    const c=cur==="OTHER"?"USD":cur;
    if(P.paypalMe||P.paypalEmail){
      const me=P.paypalMe?("https://paypal.me/"+encodeURIComponent(P.paypalMe)+(amt?"/"+amt+c:"")):"https://www.paypal.com/myaccount/transfer/homepage/pay";
      res.innerHTML=`<div class="method"><h3>PayPal</h3><p>${t("pay_pp_note")}</p>
          ${P.paypalMe?`<a class="btn gold" style="margin-top:14px" href="${esc(me)}" target="_blank" rel="noopener noreferrer">${amt?t("pay_pp_btn",{amt:fmtAmt(c,amt)}):t("pay_pp_open")} ↗</a>`:""}</div>
        <div class="method"><h3>${t("pay_pp_email")}</h3>${P.paypalEmail?`<dl class="kv">${kvRow(t("pay_pp_email"),P.paypalEmail)}</dl>`:""}<p>${t("pay_pp_steps",{cur:c})}</p></div>`;
    } else res.innerHTML=`<div class="method"><h3>PayPal</h3><p>${t("pay_soon",{mail:INBOX})}</p></div>`;
  }
  document.getElementById("p-after").innerHTML=t("pay_after",{mail:`<strong>${INBOX}</strong>`})+note;
  const sn=document.getElementById("p-supnote");sn.hidden=s.mode!=="support";sn.textContent=t("pay_sup_note");
}
function wirePay(){
  document.querySelectorAll('input[name="pmode"]').forEach(r=>r.addEventListener("change",()=>{payState.mode=r.value;renderPay();}));
  document.getElementById("p-how").addEventListener("change",e=>{payState.how=e.target.value;renderPay();});
  document.getElementById("p-cur").addEventListener("change",e=>{payState.cur=e.target.value;renderPay();});
  document.getElementById("p-amt").addEventListener("input",e=>{payState.amt=e.target.value;renderPay();});
  document.getElementById("p-ref").addEventListener("input",e=>{payState.ref=e.target.value.trim();renderPay();});
  document.querySelector(".paybody").addEventListener("click",e=>{
    const q=e.target.closest("[data-amt]");if(q){payState.amt=q.dataset.amt;document.getElementById("p-amt").value=q.dataset.amt;renderPay();return;}
    const c=e.target.closest("[data-copy]");if(c){const v=c.dataset.copy;const done=()=>{const o=c.textContent;c.textContent=t("copied");setTimeout(()=>c.textContent=o,1500)};
      try{navigator.clipboard.writeText(v).then(done,()=>{c.textContent=t("press_copy")})}catch(err){c.textContent=t("press_copy")}}
  });
  renderPay();
}

/* ---------- router (plain #name hashes) ---------- */
let lastView="";
function route(){
  const h=(location.hash||"").slice(1);
  const m=h.match(/^(wof|woc|wob|woa)(?:-(teasers|films))?$/);
  const isPay=h==="pay";
  const view=isPay?"pay":m?("w:"+m[1]+":"+(m[2]||"films")):"home";
  if(view!==lastView){
    app.innerHTML=isPay?payPage():m?world(m[1],m[2]||"films"):home();
    const sameWorld=lastView.split(":")[1]===(m&&m[1]);
    const first=lastView==="";
    lastView=view;
    if(isPay) wirePay(); else if(!m) wireHome();
    if((m&&!sameWorld&&!first)||isPay) window.scrollTo(0,0);
  }
  document.querySelectorAll("[data-nav]").forEach(a=>a.toggleAttribute("aria-current",!!(m&&a.dataset.nav===m[1])));
  if(!m&&!isPay&&h){const el=document.getElementById(h);if(el) requestAnimationFrame(()=>el.scrollIntoView());}
  else if(!m&&!isPay&&!h) window.scrollTo(0,0);
  document.title=isPay?t("pay_title")+" · KP-WOW":m?`${t(m[1]+"_name")} · KP-WOW`:"KP-WOW World of Wonders";
}
function wireHome(){
  const b=document.getElementById("copy");if(!b)return;
  b.addEventListener("click",()=>{
    const tx=document.getElementById("email").textContent;
    const done=()=>{b.textContent=t("copied");setTimeout(()=>b.textContent=t("copy_email"),1800)};
    try{navigator.clipboard.writeText(tx).then(done,()=>selectEmail());}catch(e){selectEmail();}
  });
  function selectEmail(){const r=document.createRange();r.selectNodeContents(document.getElementById("email"));const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent=t("press_copy");}
  wireForm();
}

/* Feedback form: sends to the studio inbox through FormSubmit when the site is live on the web.
   In a preview (not on github.io) nothing is sent and the page says so. */
function wireForm(){
  const f=document.getElementById("fb");if(!f)return;
  const em=f.querySelector("#fb-email"),msg=f.querySelector("#fb-msg"),st=document.getElementById("fb-status"),btn=document.getElementById("fb-send");
  const setErr=(el,id,text)=>{el.setAttribute("aria-invalid",text?"true":"false");document.getElementById(id).textContent=text;};
  em.addEventListener("input",()=>setErr(em,"fb-email-err",""));
  msg.addEventListener("input",()=>setErr(msg,"fb-msg-err",""));
  f.addEventListener("submit",async e=>{
    e.preventDefault();st.className="status";st.textContent="";
    let ok=true;const mail=em.value.trim();
    if(!mail){setErr(em,"fb-email-err",t("e_email"));ok=false;}
    else if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(mail)){setErr(em,"fb-email-err",t("e_bad"));ok=false;}
    if(!msg.value.trim()){setErr(msg,"fb-msg-err",t("e_msg"));ok=false;}
    if(!ok){(f.querySelector('[aria-invalid="true"]')||em).focus();return;}
    if(f.querySelector("#fb-hp").value){st.className="status ok";st.textContent=t("m_thanks");f.reset();return;}
    const live=/\.github\.io$/i.test(location.hostname)||/kaustubam/i.test(location.hostname);
    if(!live){st.className="status";st.textContent=t("m_preview");return;}
    btn.disabled=true;st.textContent=t("m_sending");
    const topic=f.querySelector("#fb-topic").value;
    try{
      const res=await fetch("https://formsubmit.co/ajax/"+INBOX,{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},
        body:JSON.stringify({name:f.querySelector("#fb-name").value.trim()||"(not given)",email:mail,topic,language:LANG,message:msg.value.trim(),
          _subject:"KP-WOW website: "+topic,_replyto:mail,_template:"table",_captcha:"false"})});
      const data=await res.json().catch(()=>({}));
      if(!res.ok||String(data.success)==="false") throw new Error(data.message||res.status);
      f.reset();st.className="status ok";st.textContent=t("m_sent",{mail});
    }catch(err){st.className="status bad";st.textContent=t("m_fail",{mail:INBOX});}
    finally{btn.disabled=false;}
  });
}
